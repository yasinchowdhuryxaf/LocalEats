name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore packages and audit dependencies
        run: dotnet restore LocalEats.slnx
      - name: Restore local tools
        run: dotnet tool restore
      - name: Verify formatting
        run: dotnet format LocalEats.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build LocalEats.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test LocalEats.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
